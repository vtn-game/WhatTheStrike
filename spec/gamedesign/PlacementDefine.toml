1 = "Block"             # ブロック
2 = "DestructibleBlock" # 破壊可能ブロック
3 = "GravityBarrier"    # 重力バリア
4 = "Mine"              # 地雷
5 = "Warp"              # ワープ
6 = "DamageWall"        # ダメージウォール

[FriendshipComboType]
0 = "None"              # なし
1 = "Laser"             # レーザー
2 = "EnergyCircle"      # エナジーサークル
3 = "SpeedUp"           # スピードアップ
4 = "Explosion"         # 爆発

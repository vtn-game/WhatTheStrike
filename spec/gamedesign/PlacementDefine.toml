# 配置オブジェクトID定義

[ShootableType]
0 = "None"              # 何もなし
1 = "ReflectType"       # 反射タイプ
2 = "PierceType"        # 貫通タイプ

[DamageableType]
0 = "None"              # 何もなし
1 = "SmallEnemy"        # 小型敵
2 = "MediumEnemy"       # 中型敵

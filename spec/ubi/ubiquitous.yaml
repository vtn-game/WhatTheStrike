# プロジェクト内のユビキタス言語

InGame:
  - ショット: プレイヤーがShootableをドラッグして発射する操作
  - ターン: 全Shootableが1回ずつ発射する1サイクル
  - 友情コンボ: Shootable同士がぶつかったときに発動する特殊攻撃
  - バンプ: Shootableが敵や壁に衝突すること
  - 反射: 壁や敵に当たって跳ね返ること（Reflectタイプ）
  - 貫通: 敵を突き抜けること（Pierceタイプ）

Components:
  - Shootable: ショット対象物。ドラッグ操作で発射できるオブジェクト
  - Damageable: 被ダメージ物。ダメージを受けて消滅しうるオブジェクト
  - Gimmick: ギミック。Shootableと接触時に効果を発動するオブジェクト

States:
  - Waiting: 待機中（他のキャラのターン）
  - Ready: ショット可能状態
  - Moving: 移動中
  - Stopped: 停止（ターン終了待ち）

GameFlow:
  - ステージイントロ: ステージ開始時のタイトル表示
  - プレイ中: ターン制でショットを行っている状態
  - ポーズ状態: ゲームの進行が停止している状態
  - ステージクリア: クリア条件を満たした状態
  - ゲームオーバー: 敗北条件を満たした状態

ClearConditions:
  - クリア対象: Damageableに設定される、全滅でクリアとなるフラグ
  - ターン上限: これを超えるとゲームオーバーになるターン数

FriendshipCombo:
  - レーザー: 直線状にダメージを与える
  - エナジーサークル: 周囲に円形ダメージエリアを展開
  - スピードアップ: 移動中のキャラの速度を上昇させる
  - 爆発: 範囲ダメージを与える
